name: NEXORA Android Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Package APK and ZIP
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/NEXORA.apk
          cd dist
          zip -j NEXORA-Android.zip NEXORA.apk
      - name: Upload APK and ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Android-${{ github.run_number }}
          path: |
            dist/NEXORA.apk
            dist/NEXORA-Android.zip
          if-no-files-found: error
          retention-days: 30
