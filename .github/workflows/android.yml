name: Android APK Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android 16 SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Package APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/SDStorageManager-debug.apk
          cd dist
          zip -j SDStorageManager-APK.zip SDStorageManager-debug.apk
      - name: Upload APK and ZIP
        uses: actions/upload-artifact@v4
        with:
          name: SDStorageManager-APK-${{ github.run_number }}
          path: |
            dist/SDStorageManager-debug.apk
            dist/SDStorageManager-APK.zip
          if-no-files-found: error
          retention-days: 30
