name: Đồng bộ phiên bản Minecraft mới

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/sync-minecraft-versions.mjs'
      - '.github/workflows/minecraft-version-sync.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: minecraft-version-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Đọc phiên bản Minecraft chính thức
        run: node scripts/sync-minecraft-versions.mjs
      - name: Lưu danh mục mới nếu có thay đổi
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add minecraft-versions.json
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Danh mục không thay đổi."
          else
            git commit -m "chore: cập nhật danh mục phiên bản Minecraft"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Đóng gói website sau khi có phiên bản mới
        if: steps.commit.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Xuất bản danh mục phiên bản mới
        id: deployment
        uses: actions/deploy-pages@v4
