name: Nero Game Turbo - Build APK ZIP

on:
  push:
    branches: [game-hud]
    paths:
      - 'nero-game-turbo/**'
      - '.github/workflows/nero-game-turbo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nero-game-turbo-build
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cài Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Cài Android platform và build tools
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Kiểm tra cấu trúc dự án
        run: |
          test -f nero-game-turbo/settings.gradle.kts
          test -f nero-game-turbo/app/src/main/AndroidManifest.xml
          test -f nero-game-turbo/app/src/main/java/vn/nero/gameturbo/MainActivity.kt
          test -f nero-game-turbo/app/src/main/java/vn/nero/gameturbo/HudOverlayService.kt
          test -f nero-game-turbo/app/src/main/java/vn/nero/gameturbo/DeviceStats.kt
          test -f nero-game-turbo/app/src/main/java/vn/nero/gameturbo/CircularStatView.kt
          test -f nero-game-turbo/app/src/main/res/drawable/nero_logo_mark.xml
          test -f nero-game-turbo/app/src/main/res/drawable/nero_logo_animated.xml
          test -f nero-game-turbo/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml

      - name: Build APK debug
        run: gradle --no-daemon -p nero-game-turbo :app:assembleDebug

      - name: Xác minh APK và đóng ZIP chỉ chứa APK
        shell: bash
        run: |
          set -euo pipefail
          APK="nero-game-turbo/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/Nero-Game-Turbo.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/Nero-Game-Turbo.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging dist/Nero-Game-Turbo.apk | tee dist/apk-badging.txt
          grep -q "package: name='vn.nero.gamehud'" dist/apk-badging.txt
          sha256sum dist/Nero-Game-Turbo.apk | tee dist/SHA256SUMS.txt
          cd dist
          zip -q -j Nero-Game-Turbo.zip Nero-Game-Turbo.apk
          unzip -t Nero-Game-Turbo.zip

      - name: Tải ZIP APK
        uses: actions/upload-artifact@v4
        with:
          name: Nero-Game-Turbo-ZIP
          path: dist/Nero-Game-Turbo.zip
          if-no-files-found: error
          retention-days: 30

      - name: Phát hành bản thử nghiệm
        if: github.event_name == 'push' && github.ref == 'refs/heads/game-hud'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nero-game-turbo-1.5.0
          name: Nero Game Turbo 1.5.0 - APK ZIP
          body: |
            Nero Game Turbo 1.5.0 - bản HUD tinh chỉnh theo yêu cầu.
            - Màn hình dọc của ứng dụng chỉ có một nút BẬT/TẮT HUD (sau màn hình logo mở đầu ngắn).
            - Dịch vụ HUD chỉ khởi chạy khi người dùng bật HUD và đã cấp quyền cần thiết.
            - Khi chưa vào game, bộ nhận diện kiểm tra thưa mỗi 6 giây; không lấy mẫu CPU/RAM liên tục.
            - Trong game, tay nắm dọc cố định ở cạnh trái; vuốt sang phải để mở bảng HUD.
            - CPU và RAM hiển thị vòng tròn, số và tiến trình vòng cập nhật đồng bộ.
            - Vòng FPS có trạng thái chờ khi không có nguồn đo FPS game được cấp quyền; không tạo số FPS giả.
            - Ba chế độ đổi màu khi chọn và thay đổi nhịp cập nhật HUD.
            - Dải ứng dụng có nút thêm, danh sách biểu tượng thật, chọn nhiều app; giữ rồi kéo để yêu cầu cửa sổ tự do.
            - Các nút HUD có phản hồi nhấn; mục hệ thống mở tác vụ hoặc hướng dẫn theo quyền Android.
            - APK debug đã xác minh; cửa sổ pop-up và thao tác thật cần kiểm tra trên điện thoại mục tiêu.
          prerelease: true
          make_latest: false
          files: dist/Nero-Game-Turbo.zip
          fail_on_unmatched_files: true
          overwrite_files: true
