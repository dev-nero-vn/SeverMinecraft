name: TIDEUS LINK Android APK

on:
  push:
    branches: [tideus-link]
    paths:
      - "tideus-link/android-app/**"
      - ".github/workflows/tideus-link-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install Android platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Verify real link processor source
        shell: bash
        run: |
          set -euo pipefail
          ACTIVITY="tideus-link/android-app/app/src/main/java/com/tideus/link/MainActivity.kt"
          ENGINE="tideus-link/android-app/app/src/main/java/com/tideus/link/LinkProcessor.kt"
          grep -q 'DÁN LINK CẦN BYPASS' "$ACTIVITY"
          grep -q 'BẮT ĐẦU XỬ LÝ LINK' "$ACTIVITY"
          grep -q 'TIẾN TRÌNH' "$ACTIVITY"
          grep -q 'KẾT QUẢ' "$ACTIVITY"
          grep -q 'LinkProcessor(applicationContext)' "$ACTIVITY"
          grep -q 'MAX_REDIRECTS = 8' "$ENGINE"
          grep -q 'MAX_DOWNLOAD_MB = 12' "$ENGINE"
          grep -q 'saveToDownloads' "$ENGINE"
          grep -q 'extractHtml' "$ENGINE"
          grep -q 'extractPublicRedirect' "$ENGINE"
          grep -q 'detectAccessGate' "$ENGINE"
          grep -q 'location.*replace' "$ENGINE"
          grep -q 'meta-refresh' "$ENGINE"
          if grep -qE 'renderInbox|renderConversation|renderPlugins|bottomNavigation' "$ACTIVITY"; then
            echo "The focused bypass screen must not contain old chat navigation."
            exit 1
          fi
      - name: Build debug APK
        working-directory: tideus-link/android-app
        run: gradle --no-daemon :app:assembleDebug
      - name: Run link processor unit and live network tests
        working-directory: tideus-link/android-app
        run: gradle --no-daemon :app:testDebugUnitTest
      - name: Verify APK and package APK-only ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tideus-link/release/package
          APK="tideus-link/android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" tideus-link/release/TIDEUS-LINK.apk
          cp "$APK" tideus-link/release/package/TIDEUS-LINK.apk
          (cd tideus-link/release/package && zip -q ../TIDEUS-LINK.zip TIDEUS-LINK.apk)
          test -s tideus-link/release/TIDEUS-LINK.zip
          unzip -t tideus-link/release/TIDEUS-LINK.zip
          ZIP_ITEMS="$(unzip -Z1 tideus-link/release/TIDEUS-LINK.zip)"
          test "$ZIP_ITEMS" = "TIDEUS-LINK.apk"
          echo "ZIP contains exactly one file: TIDEUS-LINK.apk"
      - name: Upload APK and ZIP only
        uses: actions/upload-artifact@v4
        with:
          name: TIDEUS-LINK-Bypass-APK
          path: |
            tideus-link/release/TIDEUS-LINK.apk
            tideus-link/release/TIDEUS-LINK.zip
          if-no-files-found: error
          retention-days: 30
