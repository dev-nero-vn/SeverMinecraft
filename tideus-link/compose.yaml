services:
  tideus-link:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tideus-link
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: 8787
      DATA_DIR: /app/data
      NODE_ENV: production
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - tideus_data:/app/data
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tideus_data:
